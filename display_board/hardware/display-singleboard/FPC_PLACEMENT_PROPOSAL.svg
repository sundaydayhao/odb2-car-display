<text x="927" y="285" class="t">天线 → 屏金属：15.386 mm</text>
<text x="1060" y="420" class="small">屏总厚暂按 6 mm</text>
<text x="1120" y="349" class="small">R = 2 mm（待确认）</text>
<text x="890" y="520" class="t">LCD 已改中央 X29、下沿 Y−17；不依靠横向硬折排线。</text>
<text x="890" y="555" class="t">几何路径 54.71 + 插入 3 + 装配余量 4 = 61.71 mm</text>
<text x="890" y="590" class="t">商品参考 66.54 mm，余量约 4.83 mm：仍未确认可装配。</text>
<text x="890" y="625" class="t">真实尾根、可用尾长、允许弯折半径、接触面均需核对。</text>
<text x="890" y="681" class="h">固定和维修</text>
<text x="890" y="716" class="t">前框承屏，承载壳承 PCB / 底座，后盖可单独拆卸。</text>
<text x="890" y="751" class="t">前框卡扣预定位 + 4 螺钉，PCB 四角固定。</text>
<text x="890" y="786" class="t">USB 调试 / SD / 5V / 电源拨键从侧面操作。</text>
<text x="890" y="821" class="t">RST / BOOT 是凹入维护小孔，不使用大操作帽。</text>
<text x="890" y="856" class="t">喇叭 3W 候选：约 5cc 后腔，左向导声；USB-A 取消。</text>
<rect x="55" y="925" width="1685" height="120" fill="#fff2d8" stroke="#d6a355" stroke-width="2"/>
<text x="75" y="962" class="t">未确认：触摸盖板外形、厚度、有效显示区，端口配套插头，麦克风 / 喇叭实物尺寸。</text>
<text x="75" y="997" class="t">当前显示窗口 154 × 86 mm 仅为可修改占位，可能遮挡实际显示区；RF 15 mm 仅通过名义实体几何检查。</text>
<text x="75" y="1030" class="small">没有热、振动、材料强度或实物装配验证；所有模型保留参数源文件，不能直接作为量产放行。</text>
