<circle cx="311.8" cy="273.4" r="7" fill="white"/><circle cx="311.8" cy="273.4" r="2.5" fill="#835ba6"/>
<text x="284.80" y="278.40" class="body" text-anchor="end">J9 / F</text>
<text x="425.00" y="542.00" class="small" text-anchor="middle">下侧壳体留给底座；内部排线不需要底侧外壳插口</text>
<text x="822.00" y="150.00" class="body" text-anchor="start">连接器位置（PCB 绝对坐标）</text>
<text x="822.00" y="190.00" class="small" text-anchor="start">LCD J302：B (31, −26)，180°</text>
<text x="822.00" y="223.00" class="small" text-anchor="start">触摸 J308：B (69, −25.5)，180°</text>
<text x="822.00" y="256.00" class="small" text-anchor="start">摄像头 J9：F (3.5, −61)，−90°</text>
<text x="822.00" y="314.00" class="small" text-anchor="start">绿色：朝屏幕一面；箭头为插口朝向。</text>
<text x="822.00" y="347.00" class="small" text-anchor="start">LCD / 触摸排线由下向上插入。</text>
<text x="822.00" y="380.00" class="small" text-anchor="start">屏幕正面左出线，在背面视图位于右侧。</text>
<text x="822.00" y="432.00" class="small" text-anchor="start">紫色：朝背壳一面，摄像头竖插 +Z。</text>
<text x="822.00" y="465.00" class="small" text-anchor="start">预留锁扣、弯折和背壳净空。</text>
<text x="40.00" y="618.00" class="title" text-anchor="start">装配与验证边界</text>
<text x="40.00" y="660.00" class="small" text-anchor="start">1. 先连接并锁紧 LCD、触摸和摄像头排线，再固定 PCB、合上背壳。</text>
<text x="40.00" y="692.00" class="small" text-anchor="start">2. FPC 接触面、针 1、长度和可弯区域需用所选模组图纸 / 实物确认；禁止靠扭转硬折迁就针序。</text>
<text x="40.00" y="724.00" class="small" text-anchor="start">3. 主板选择两数据通道 MIPI DSI；RGB 是另一接口方式，本板不增加 RGB 并行电路。</text>
<text x="40.00" y="756.00" class="small" text-anchor="start">4. 布线和检查在独立工作版进行。屏幕供电、背光电流及两通道配置尚未获得模组级确认。</text>
</svg>