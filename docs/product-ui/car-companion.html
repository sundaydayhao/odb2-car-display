  #car-companion .cc-sheet { width:min(420px,100%); background:var(--cc-panel); color:var(--cc-ink); padding:18px 24px 22px; border-radius:8px; box-shadow:0 12px 40px rgb(0 0 0 / .18); }
  #car-companion .cc-sheet-head { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--cc-line); padding-bottom:7px; margin-bottom:10px; }
  #car-companion .cc-sheet h2 { margin:0; font-size:20px; font-weight:500; }
  #car-companion .cc-setting { padding:12px 0; display:flex; align-items:center; justify-content:space-between; gap:14px; border-bottom:1px solid var(--cc-line); font-size:15px; }
  #car-companion .cc-setting:last-child { border-bottom:0; }
  #car-companion .cc-setting select { max-width:176px; background:var(--cc-bg); color:var(--cc-ink); border:1px solid var(--cc-line); border-radius:4px; padding:5px 8px; font-size:14px; }
  #car-companion .cc-setting input { width:130px; accent-color:var(--cc-blue); }
  #car-companion .cc-setting input[type="number"] { width:80px; border:1px solid var(--cc-line); background:var(--cc-bg); padding:5px; color:var(--cc-ink); border-radius:4px; }
  #car-companion .cc-detail-value { color:var(--cc-muted); text-align:right; }
  #car-companion .cc-alert-detail { padding:14px 0; }
  #car-companion .cc-alert-detail strong { font-weight:500; color:var(--cc-red); }
  #car-companion .cc-alert-detail p { margin:8px 0; font-size:15px; }
  #car-companion .cc-primary { background:var(--cc-blue); color:var(--cc-on-accent); width:100%; min-height:42px; border-radius:5px; margin-top:14px; }
  #car-companion .cc-palette-button { color:var(--cc-secondary); }
  #car-companion .cc-skin-option { display:flex; align-items:center; gap:13px; width:100%; padding:18px 4px; min-height:70px; border-bottom:1px solid var(--cc-line); text-align:left; }
  #car-companion .cc-skin-option:last-child { border-bottom:0; }
  #car-companion .cc-skin-option input { accent-color:var(--cc-blue); width:17px; height:17px; margin:0; }
  #car-companion .cc-skin-swatches { display:flex; gap:3px; margin-left:auto; }
  #car-companion .cc-skin-swatches span { width:22px; height:28px; transform:skewX(-12deg); display:block; }
  #car-companion .cc-chart-area { fill:var(--cc-blue); opacity:.11; }
  #car-companion .cc-device[data-connected="false"] .cc-speed,
  #car-companion .cc-device[data-connected="false"] .cc-drive-side .cc-number,
  #car-companion .cc-device[data-connected="false"] .cc-health-item .cc-number,
  #car-companion .cc-device[data-connected="false"] .cc-tire .cc-number,
  #car-companion .cc-device[data-connected="false"] .cc-boost .cc-number { color:var(--cc-muted); }
  #car-companion .cc-device[data-connected="false"] .cc-gear { color:var(--cc-muted); background:var(--cc-track); }
  @media(max-width:620px) {
    #car-companion .cc-device { min-height:480px; height:auto; }
    #car-companion .cc-header { margin:0 18px; }
    #car-companion .cc-clock { display:none; }
    #car-companion .cc-page-index { display:none; }
    #car-companion .cc-content { padding:18px; }
    #car-companion .cc-actions { gap:3px; }
    #car-companion .cc-nav { padding:4px 8px; }
    #car-companion .cc-nav button { flex-direction:column; gap:3px; font-size:13px; }
    #car-companion .cc-drive-main { grid-template-columns:1fr; }
    #car-companion .cc-speed-area { padding:5px 0 20px; }
    #car-companion .cc-drive-side { border-left:0; border-top:1px solid var(--cc-line); padding:16px; grid-template-columns:1fr 1fr; }
    #car-companion .cc-range { grid-column:auto; }
    #car-companion .cc-drive-side .cc-instant { align-self:center; }
    #car-companion .cc-drive-side .cc-fuel-summary { display:none; }
    #car-companion .cc-drive-side .cc-number { font-size:40px; }
    #car-companion .cc-secondary { grid-template-columns:1fr 1fr; row-gap:18px; padding-bottom:5px; }
    #car-companion .cc-health-grid { grid-template-columns:1fr 1fr; }
    #car-companion .cc-health-item:not(:nth-child(3n+1)) { padding-left:0; }
    #car-companion .cc-health-item:nth-child(even) { padding-left:14px; }
    #car-companion .cc-health-item:nth-child(n)::after { left:0; }
    #car-companion .cc-health-item:nth-child(even)::after { left:14px; }
    #car-companion .cc-health-item:nth-child(n+3) { padding-top:17px; border-top:1px solid var(--cc-line); }
    #car-companion .cc-service-row { grid-template-columns:1fr; gap:0; }
    #car-companion .cc-service-button { min-height:56px; }
    #car-companion .cc-tire-layout { grid-template-columns:1fr 70px 1fr; gap:8px; min-height:300px; }
    #car-companion .cc-car-map { width:70px; height:220px; }
    #car-companion .cc-car-body { inset:0 7px; }
    #car-companion .cc-windscreen { left:13px; right:13px; top:49px; height:100px; }
    #car-companion .cc-car-roof { left:17px; right:17px; top:72px; height:57px; border-radius:5px; }
    #car-companion .cc-wheel { left:0; width:7px; top:50px; }
    #car-companion .cc-wheel.fr { right:0; }
    #car-companion .cc-wheel.rl { top:169px; }
    #car-companion .cc-wheel.rr { right:0; top:169px; }
    #car-companion .cc-tire { min-width:0; padding-left:5px; border-left-width:2px; }
    #car-companion .cc-tire .cc-number { font-size:32px; }
    #car-companion .cc-tire .cc-value-row { gap:4px; flex-wrap:wrap; row-gap:0; }
    #car-companion .cc-tire-summary { flex-wrap:wrap; }
    #car-companion .cc-tire .cc-note { font-size:12px; }
    #car-companion .cc-trip-main { grid-template-columns:1fr; gap:20px; }
    #car-companion .cc-trip-stats { grid-template-columns:1fr 1fr; }
    #car-companion .cc-trip-top { flex-wrap:wrap; }
    #car-companion .cc-performance-main { grid-template-columns:1fr; gap:24px; }
    #car-companion .cc-g-area { grid-template-columns:140px 1fr; }
    #car-companion .cc-records { gap:10px; }
    #car-companion .cc-records .cc-number { font-size:24px; }
    #car-companion .cc-sheet { padding:12px 16px; }
    #car-companion .cc-status { font-size:12px; gap:5px; }
    #car-companion .cc-title { font-size:18px; }
    #car-companion .cc-tach { grid-template-columns:87px 1fr 56px; gap:9px; }
    #car-companion .cc-revs { gap:2px; }
    #car-companion .cc-records > div { padding-left:7px; }
  }
</style>
<script>
(() => {
  const root = document.getElementById('car-companion');
  const device = root.querySelector('.cc-device');
  const content = root.querySelector('.cc-content');
  const overlay = root.querySelector('.cc-overlay');
  const settings = { appearance:'夜间', skin:'夜行霓虹', scenario:'行驶', powertrain:'涡轮增压', pressure:'bar', fuelPrice:8.15, brightness:75 };
  const skins = {
    '夜行霓虹': { id:'neon', colors:['#46f3c5','#ddf87a','#ff86bb'] },
    '熔岩赛道': { id:'lava', colors:['#ff9b70','#7bdaff','#ffd079'] },
    '酸性机能': { id:'acid', colors:['#e7fb69','#59e1ce','#ff86bb'] }
  };
  let page = 'drive', period = '本次', lastFocus = null;
  const pageNames = {drive:'驾驶概览',health:'车辆状态',tires:'四轮胎压',trip:'行程与花费',performance:'动力与性能'};
  const online = () => settings.scenario !== '待连接';
  const low = () => settings.scenario === '胎压偏低';
  const val = number => online() ? number : '--';
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const number = (value, unit, live=true) => `<div class="cc-value-row"><span class="cc-number">${live?val(value):value}</span><span class="cc-unit">${unit}</span></div>`;
  const metric = (title,value,unit) => `<div><p class="cc-kicker">${title}</p>${number(value,unit)}</div>`;
  const meter = (amount) => `<div class="cc-meter"><span style="width:${online()?amount:0}%"></span></div>`;
  const revs = rpm => `<div class="cc-revs" aria-hidden="true">${Array.from({length:32},(_,i)=>`<span data-lit="${online()&&i<Math.round(rpm/8000*32)}" data-zone="${i>=28?'limit':i>=24?'high':'normal'}"></span>`).join('')}</div>`;
  function drive() {
    return `<div class="cc-tach"><span class="cc-kicker">发动机 · rpm</span>${revs(2450)}<span class="cc-tach-amount">${val('2,450')}</span></div>
    <div class="cc-drive-main"><div class="cc-speed-area"><p class="cc-kicker">当前车速</p><div class="cc-speed-line"><span class="cc-number cc-speed">${val('86')}</span><span class="cc-number cc-gear">${val('D6')}</span></div><span class="cc-unit">km/h</span></div>
    <div class="cc-drive-side"><div class="cc-range"><p class="cc-kicker">预估续航</p><div class="cc-value-row"><span><span class="cc-number">${val('386')}</span> <span class="cc-unit">km</span></span><span class="cc-fuel-summary">${icon('fuel')}${val('68')}%</span></div>${meter(68)}</div>
    <div class="cc-instant" style="grid-column:1/-1"><p class="cc-kicker">瞬时油耗 · 估算</p>${number('6.8','L/100km')}</div></div></div>
    <div class="cc-secondary">${metric('水温','89','°C')}${metric('机油温度','98','°C')}${metric('系统电压','14.2','V')}${metric('平均油耗 · 估算','7.4','L/100km')}</div>`;
  }
  function health() {
    const items = [ ['冷却液温度','89','°C','本次最高 92°C','thermometer'],['机油温度','98','°C','本次最高 102°C','droplet'],['变速箱温度','82','°C','本次最高 86°C','settings'],['进气温度','32','°C','本次最高 38°C','wind'],['机油压力','3.6','bar','发动机运转中','gauge'],['系统电压','14.2','V','发动机运转中','battery-charging'] ];
    return `<div class="cc-health-grid">${items.map(([title,v,u,n,i])=>`<div class="cc-health-item"><p class="cc-kicker">${icon(i)}${title}</p>${number(v,u)}<span class="cc-note">${online()?n:'等待车辆数据'}</span></div>`).join('')}</div><div class="cc-service-row"><button class="cc-service-button" type="button" data-action="diagnostics"><span>发动机状态<small>${online()?'未见故障提示':'尚未读取'}</small></span>${icon('chevron-right')}</button><button class="cc-service-button" type="button" data-action="maintenance"><span>保养计划<small>距下次保养 2,400 km</small></span>${icon('chevron-right')}</button></div>`;
  }
  function pressure(bar) {
    return settings.pressure==='kPa' ? Math.round(bar*100) : settings.pressure==='psi' ? (bar*14.5038).toFixed(1) : bar.toFixed(1);
  }
  function tire(name,bar,temp,isLow=false) {
    return `<div class="cc-tire" data-low="${isLow}"><p class="cc-kicker">${name}</p>${number(pressure(bar),settings.pressure)}<div class="cc-note">${online()?temp+'°C · '+(isLow?'压力偏低':'已更新'):'等待传感器'}</div></div>`;
  }
  function tires() {
    return `<div class="cc-tire-layout"><div class="cc-tire-column">${tire('左前',2.4,31)}${tire('左后',low()?1.7:2.3,low()?38:32,low())}</div>
    <div class="cc-car-map" role="img" aria-label="车辆俯视图，标记四轮位置"><div class="cc-axle"></div><div class="cc-axle rear"></div><div class="cc-car-body"></div><div class="cc-windscreen"></div><div class="cc-car-roof"></div><div class="cc-wheel"></div><div class="cc-wheel fr"></div><div class="cc-wheel rl" ${low()?'style="background:var(--cc-red)"':''}></div><div class="cc-wheel rr"></div></div>
    <div class="cc-tire-column">${tire('右前',2.4,30)}${tire('右后',2.3,32)}</div></div>
    <div class="cc-tire-summary"><span>${online()?'更新于 09:41:02':'等待轮胎传感器'}</span><span>冷胎基准 ${pressure(2.4)} / ${pressure(2.3)} ${settings.pressure}</span><button type="button" data-action="tire-settings">轮胎设置</button></div>`;
  }
  const trips = {
    '本次': {distance:'37.6',duration:'44',avg:'51.3',economy:'7.4',used:'2.78',idle:'06:20',time:'08:57 – 09:41',cost:2.78,values:[8.5,8.1,7.8,7.4,7.6,7.1,7.3,7.0]},
    '今日': {distance:'82.4',duration:'106',avg:'46.6',economy:'7.6',used:'6.26',idle:'14:10',time:'今日 · 3 段行程',cost:6.26,values:[8.8,8.2,7.5,7.6,7.3,7.8,7.4,7.0]},
    '本箱油': {distance:'326',duration:'418',avg:'46.8',economy:'7.5',used:'24.45',idle:'48:30',time:'自上次加油 · 9 月 2 日',cost:24.45,values:[8.5,8.0,7.7,7.4,7.8,7.1,7.0,7.5]}
  };
  function trip() {
    const t = trips[period];
    return `<div class="cc-trip-top"><div class="cc-segments" aria-label="行程范围">${Object.keys(trips).map(p=>`<button type="button" data-period="${p}" aria-pressed="${p===period}">${p}</button>`).join('')}</div><span class="cc-note">${online()?t.time:'已保存行程 · '+t.time}</span></div>
    <div class="cc-trip-main"><div class="cc-trip-distance"><p class="cc-kicker">行驶里程</p>${number(t.distance,'km',false)}<div class="cc-note">行驶 ${t.duration} 分钟 · 平均 ${t.avg} km/h</div></div><div><div class="cc-chart-label"><span>平均油耗趋势 · 估算</span><span>L/100km</span></div><svg class="cc-chart" role="img" aria-label="本范围平均油耗趋势，纵轴单位升每百公里"></svg></div></div>
    <div class="cc-trip-stats">${[['平均油耗',t.economy,'L/100km'],['消耗燃油',t.used,'L'],['燃油费用',(t.cost*settings.fuelPrice).toFixed(2),'元'],['平均车速',t.avg,'km/h'],['怠速时间',t.idle,'分:秒'],['当前油价',settings.fuelPrice.toFixed(2),'元/L']].map(([title,v,u])=>`<div class="cc-trip-stat"><p class="cc-kicker">${title}</p>${number(v,u,false)}</div>`).join('')}</div>`;
  }
  function performance() {
    const turbo = settings.powertrain==='涡轮增压';
    return `<div class="cc-performance-main"><div class="cc-boost"><p class="cc-kicker">${turbo?'涡轮增压 · 相对压力':'进气歧管 · 绝对压力'}</p>${number(turbo?'0.62':'84',turbo?'bar':'kPa')}
    <div class="cc-performance-bars"><div><div class="cc-bar-title"><span>节气门开度</span><span>${val('38')} %</span></div>${meter(38)}</div><div><div class="cc-bar-title"><span>发动机负载</span><span>${val('52')} %</span></div>${meter(52)}</div></div></div>
    <div><div class="cc-g-area"><svg class="cc-g" viewBox="0 0 140 140" role="img" aria-label="车辆横向与纵向加速度示意，满量程正负 0.5 g"><circle class="cc-ring" cx="70" cy="70" r="55"/><circle class="cc-ring" cx="70" cy="70" r="28"/><path class="cc-ring" d="M15 70h110M70 15v110"/><text x="70" y="11" text-anchor="middle">0.5 g</text>${online()?'<path class="cc-trace" d="M70 70 L70 64 L72 58 L75 53 L74 48 L79 46 L83 48"/><circle class="cc-point" cx="83" cy="48" r="5"/>':''}</svg><div class="cc-g-values"><p class="cc-kicker">纵向</p>${number('0.20','g')}<p class="cc-kicker">横向</p>${number('0.12','g')}</div></div><div class="cc-performance-rpm"><span class="cc-kicker">发动机转速</span>${number('3,820','rpm')}</div></div></div>
    <div class="cc-records">${[['0–100 km/h','8.4','s'],['80–120 km/h','5.8','s'],['100–0 km/h','39.2','m']].map(([title,v,u])=>`<div><p class="cc-kicker">${title}</p>${number(v,u,false)}</div>`).join('')}</div><div class="cc-record-heading"><span>上次记录 · 9 月 5 日 · 封闭场地</span><button type="button" data-action="records">查看记录 ${icon('chevron-right')}</button></div>`;
  }
  function drawChart() {
    const svg = root.querySelector('.cc-chart');
    if (!svg) return;
    const width = svg.getBoundingClientRect().width;
    const values = trips[period].values, left=27, right=8, top=12, bottom=93;
    const min = Math.min(...values)-.5, max = Math.max(...values)+.5;
    const x = i=>left+i*(width-left-right)/(values.length-1), y=v=>bottom-(v-min)/(max-min)*(bottom-top);
    const points=values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    svg.setAttribute('viewBox',`0 0 ${width} 114`);
    svg.innerHTML=`<polygon class="cc-chart-area" points="${left},${bottom} ${points} ${width-right},${bottom}"/>`+[min,(min+max)/2,max].map(v=>`<path d="M${left} ${y(v)}H${width-right}" fill="none" stroke="var(--cc-line)"/><text x="0" y="${y(v)+4}">${v.toFixed(1)}</text>`).join('')+`<polyline points="${points}" fill="none" stroke="var(--cc-blue)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${x(7)}" cy="${y(values[7])}" r="3.5" fill="var(--cc-blue)"/><text x="${left}" y="111">起点</text><text x="${width-right}" y="111" text-anchor="end">当前</text>`;
  }
  function render() {
    device.dataset.appearance=settings.appearance==='夜间'?'dark':'light';
    device.dataset.skin=skins[settings.skin].id;
    device.dataset.connected=String(online());
    root.querySelector('.cc-title').textContent=pageNames[page];
    root.querySelector('.cc-page-index').textContent=String(Object.keys(pageNames).indexOf(page)+1).padStart(2,'0');
    const status=root.querySelector('.cc-status');
    status.dataset.alert=String(low());
    root.querySelector('.cc-status-text').textContent=low()?'左后胎压偏低':online()?'暂无提醒':'等待车辆';
    root.querySelector('.cc-dot').style.background=online()?'':'var(--cc-muted)';
    root.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-current',b.dataset.page===page?'page':'false'));
    content.innerHTML=({drive,health,tires,trip,performance})[page]();
    if (!online()) root.querySelectorAll('.cc-wheel').forEach(w=>w.style.background='var(--cc-muted)');
    if (globalThis.lucide) lucide.createIcons();
    drawChart();
  }
  function closeDialog() { overlay.hidden=true; if(lastFocus)lastFocus.focus(); }
  function dialog(title,html) {
    lastFocus=document.activeElement;
    root.querySelector('#cc-dialog-title').textContent=title;
    root.querySelector('.cc-sheet-content').innerHTML=html;
    overlay.hidden=false;
    overlay.querySelector('[data-action="close"]').focus();
    if(globalThis.lucide)lucide.createIcons();
  }
  const detail=(name,value)=>`<div class="cc-setting"><span>${name}</span><span class="cc-detail-value">${value}</span></div>`;
  const select=(key,label,values)=>`<label class="cc-setting"><span>${label}</span><select data-setting="${key}">${values.map(v=>`<option${settings[key]===v?' selected':''}>${v}</option>`).join('')}</select></label>`;
  const skinOptions=()=>Object.entries(skins).map(([name,skin])=>`<label class="cc-skin-option"><input type="radio" name="cc-skin" data-setting="skin" value="${name}"${settings.skin===name?' checked':''}><span class="cc-skin-swatches" aria-hidden="true">${skin.colors.map(color=>`<span style="background:${color}"></span>`).join('')}</span><span>${name}</span></label>`).join('');
  root.addEventListener('click',event=>{
    const button=event.target.closest('button');
    if(!button)return;
    if(button.dataset.page){page=button.dataset.page;render();return;}
    if(button.dataset.period){period=button.dataset.period;render();return;}
    switch(button.dataset.action){
      case 'close':closeDialog();break;
      case 'style':dialog('界面风格',skinOptions());break;
      case 'settings':dialog('显示与车辆',select('appearance','外观',['日间','夜间'])+select('powertrain','动力类型',['涡轮增压','自然吸气'])+`<label class="cc-setting"><span>亮度 <output id="cc-brightness">${settings.brightness}%</output></span><input type="range" min="20" max="100" value="${settings.brightness}" data-setting="brightness" aria-label="屏幕亮度"></label><label class="cc-setting"><span>燃油单价 · 元/L</span><input type="number" min="1" max="30" step="0.01" value="${settings.fuelPrice}" data-setting="fuelPrice" aria-label="燃油单价"></label>`);break;
      case 'alerts':dialog('车辆提醒',low()?`<div class="cc-alert-detail"><strong>左后轮压力偏低</strong><p>${pressure(1.7)} ${settings.pressure} · 38°C</p><span class="cc-note">09:40:52 · 当前提醒</span></div><button type="button" class="cc-primary" data-action="view-tires">查看四轮胎压</button>`:detail('当前提醒',online()?'暂无提醒':'尚未获取车辆状态'));break;
      case 'view-tires':closeDialog();page='tires';render();break;
      case 'diagnostics':dialog('发动机状态',detail('故障灯',online()?'未点亮':'尚未读取')+detail('当前故障',online()?'0 项':'--')+detail('待定故障',online()?'0 项':'--')+detail('排放监测',online()?'已完成':'尚未读取')+detail('最后读取',online()?'09:41:02':'--'));break;
      case 'maintenance':dialog('保养计划',detail('机油与机滤','剩余 2,400 km')+detail('空气滤芯','剩余 8,600 km')+detail('下次保养日期','2026 年 12 月')+detail('里程依据','手动基准 + 累计行程'));break;
      case 'tire-settings':dialog('轮胎设置',select('pressure','压力单位',['bar','kPa','psi'])+detail('前轮冷胎基准',pressure(2.4)+' '+settings.pressure)+detail('后轮冷胎基准',pressure(2.3)+' '+settings.pressure)+detail('车辆档案','自定义车辆'));break;
      case 'records':dialog('上次性能记录',detail('记录日期','9 月 5 日 15:32')+detail('0–100 km/h','8.4 s')+detail('80–120 km/h','5.8 s')+detail('100–0 km/h','39.2 m')+detail('测量环境','封闭场地'));break;
    }
  });
  root.addEventListener('change',event=>{
    const key=event.target.dataset.setting;
    if(!key)return;
    if(key==='fuelPrice')settings[key]=Math.max(1,Math.min(30,Number(event.target.value)||8.15));
    else settings[key]=event.target.value;
    render();
    if(key==='pressure')dialog('轮胎设置',select('pressure','压力单位',['bar','kPa','psi'])+detail('前轮冷胎基准',pressure(2.4)+' '+settings.pressure)+detail('后轮冷胎基准',pressure(2.3)+' '+settings.pressure)+detail('车辆档案','自定义车辆'));
  });
  root.addEventListener('input',event=>{
    if(event.target.dataset.setting!=='brightness')return;
    settings.brightness=Number(event.target.value);
    root.querySelector('#cc-brightness').textContent=settings.brightness+'%';
    content.style.opacity=String(.5+settings.brightness/200);
  });
  overlay.addEventListener('click',event=>{if(event.target===overlay)closeDialog();});
  root.addEventListener('keydown',event=>{
    if(overlay.hidden)return;
    if(event.key==='Escape'){closeDialog();return;}
    if(event.key==='Tab'){
      const controls=[...overlay.querySelectorAll('button,select,input')].filter(e=>!e.disabled);
      const first=controls[0],last=controls[controls.length-1];
      if(event.shiftKey&&document.activeElement===first){last.focus();event.preventDefault();}
      else if(!event.shiftKey&&document.activeElement===last){first.focus();event.preventDefault();}
    }
  });
  new ResizeObserver(drawChart).observe(device);
  render();
  if(globalThis.Tweak){
    const tweak=new Tweak({container:device,onChange:()=>{closeDialog();render();}});
    tweak.addSelect(settings,'skin',{label:'界面风格',options:Object.keys(skins)});
    tweak.addSelect(settings,'appearance',{label:'外观',options:['日间','夜间']});
    tweak.addSelect(settings,'scenario',{label:'车辆状态',options:['行驶','待连接','胎压偏低']});
    tweak.addSelect(settings,'powertrain',{label:'动力类型',options:['涡轮增压','自然吸气']});
  }
})();
</script>
