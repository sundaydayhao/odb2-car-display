<line x1="76" y1="188" x2="317.29" y2="188" stroke="#52718a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
<text x="127" y="177" font-size="16" fill="#284557" font-weight="400">尾端中心 X = 80.43 mm（名义）</text>
<text x="65" y="551" font-size="17" fill="#284557" font-weight="400">屏正面向右为 X；PCB 对应 X = 70.50 mm。</text>
<text x="65" y="582" font-size="16" fill="#607686" font-weight="400">从屏背面看左右镜像；预折横向偏移仍需核实。</text>
<rect x="680" y="120" width="675" height="508" rx="6" fill="#fff" stroke="#d5dee5" stroke-width="1.6"/>
<text x="705" y="154" font-size="22" fill="#284557" font-weight="700">纵向定位关系</text>
<text x="705" y="190" font-size="19" fill="#284557" font-weight="400">E：折后金手指最末端 → 屏下边，待测</text>
<text x="705" y="225" font-size="19" fill="#284557" font-weight="400">I：插座实际插入深度，待选定料号</text>
<rect x="703" y="251" width="627" height="97" rx="6" fill="#eaf3f9" stroke="none" stroke-width="1.6"/>
<text x="725" y="286" font-size="23" fill="#216a96" font-weight="700">入口距屏下边 d = E − I</text>
<text x="725" y="323" font-size="23" fill="#216a96" font-weight="700">PCB 上边到入口 Y = 92.48 − E + I</text>
<text x="705" y="386" font-size="19" fill="#284557" font-weight="700">原图约 14 mm 的纵向位置尚无实物依据。</text>
<text x="705" y="421" font-size="18" fill="#284557" font-weight="400">先测自然位置，再在插接高度下核对：</text>
<text x="721" y="453" font-size="18" fill="#284557" font-weight="400">• 尾端可自由抬起，排线没有拉力和死折。</text>
<text x="721" y="485" font-size="18" fill="#284557" font-weight="400">• 插到底并闭合锁扣，合壳后没有压迫。</text>
<text x="721" y="517" font-size="18" fill="#284557" font-weight="400">• 插座接触面与实物露铜面对应。</text>
<text x="705" y="566" font-size="19" fill="#a16b23" font-weight="700">56.54 mm 是展开参考尺寸，不能替代 E。</text>
<text x="705" y="602" font-size="17" fill="#607686" font-weight="400">本图是定位方法，非 PCB 封装图或合壳验证。</text>
<rect x="45" y="649" width="1310" height="153" rx="6" fill="#fff4dc" stroke="#e6c881" stroke-width="1.6"/>
<text x="67" y="685" font-size="22" fill="#805a24" font-weight="700">插接规格已读出，具体 FPC 座尚未锁定</text>
<text x="67" y="721" font-size="20" fill="#805a24" font-weight="400">30P / 0.5 mm / 厚 0.30 ±0.05 mm；宽 15.50 ±0.1 mm；露铜长 3.50 ±0.3 mm。</text>
<text x="67" y="758" font-size="19" fill="#805a24" font-weight="400">FH12A 对照中发现宽度和露铜长度公差未完全覆盖；不能只按针数和间距判定兼容。</text>
<text x="67" y="785" font-size="15" fill="#987444" font-weight="400">依据：用户 LCM 规格书第 5 页、出厂预折状态回复、Hirose FH12 目录；修订 D / 2026-09-19。</text>
